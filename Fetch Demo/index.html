<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>REST API Demo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Product Management</h1>

    <!-- GET ALL -->
    <button id="loadBtn">Load Products</button>

    <hr>

    <!-- GET BY ID -->
    <h2>Get Product</h2>

    <form id="getForm">
        <input
            type="number"
            id="getId"
            placeholder="Enter Product ID"
            required
        >

        <button type="submit">Get Product</button>
    </form>

    <hr>

    <!-- ADD -->
    <h2>Add Product</h2>

    <form id="addForm">

        <input
            type="text"
            id="addName"
            placeholder="Product Name"
            required
        >

        <input
            type="number"
            id="addPrice"
            placeholder="Price"
            required
        >

        <input
            type="text"
            id="addColor"
            placeholder="Color"
            required
        >

        <button type="submit">Add Product</button>

    </form>

    <hr>

    <!-- UPDATE -->
    <h2>Update Product</h2>

    <form id="updateForm">

        <input
            type="number"
            id="updateId"
            placeholder="Product ID"
            required
        >

        <input
            type="text"
            id="updateName"
            placeholder="Product Name"
            required
        >

        <input
            type="number"
            id="updatePrice"
            placeholder="Price"
            required
        >

        <input
            type="text"
            id="updateColor"
            placeholder="Color"
            required
        >

        <button type="submit">Update Product</button>

    </form>

    <hr>

    <!-- DELETE -->

    <h2>Delete Product</h2>

    <form id="deleteForm">

        <input
            type="number"
            id="deleteId"
            placeholder="Product ID"
            required
        >

        <button type="submit">Delete Product</button>

    </form>

    <hr>

    <h2>Output</h2>

    <pre id="output"></pre>

    <script src="script.js"></script>

</body>
</html>
